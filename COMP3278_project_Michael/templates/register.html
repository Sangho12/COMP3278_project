{% extends 'base.html' %}
{% block title %}Register | HKUgram{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8 login-wrapper">
    <div class="login-container">
      <h2 class="login-title">Register</h2>
      <!-- Flash messages (same style as login page, no function changes) -->
      {% with messages = get_flashed_messages() %}
        {% if messages %}
          <div class="alert alert-warning text-center mb-4">
            {% for message in messages %}
              {{ message }}
            {% endfor %}
          </div>
        {% endif %}
      {% endwith %}
      <form method="post" action="{{ url_for('register') }}">
        <!-- Username Input (EXACT SAME AS LOGIN PAGE) -->
        <div class="mb-4 form-group">
          <label class="form-label">Username</label>
          <input class="form-control form-input-lg" name="username" required />
        </div>
        <!-- Password Input (EXACT SAME AS LOGIN PAGE) -->
        <div class="mb-4 form-group">
          <label class="form-label">Password</label>
          <input class="form-control form-input-lg" type="password" name="password" required />
        </div>
        <!-- Profile Picture URL Input (NEW, SAME STYLE AS OTHER FIELDS) -->
        <div class="mb-4 form-group">
          <label class="form-label">Profile Picture URL (Optional)</label>
          <input class="form-control form-input-lg" name="profile_picture" />
        </div>
        <!-- Action Buttons (SAME STYLE AS LOGIN, TEXT ONLY CHANGED) -->
        <div class="button-group">
          <button class="btn btn-primary btn-lg-custom" type="submit">Register</button>
          <a class="btn btn-link btn-link-lg" href="{{ url_for('login') }}">Back to Login</a>
        </div>
      </form>
    </div>
  </div>
</div>

<style>
    /* 🔥 EXACT SAME CSS AS YOUR LOGIN.HTML - NO CHANGES WHATSOEVER */
    /* Centered wrapper */
    .login-wrapper {
        margin-top: 64px !important;
        display: flex;
        justify-content: center;
    }

    /* Card container (matches login's rounded, padded box) */
    .login-container {
        max-width: 360px;
        padding: 48px 40px !important;
        background: var(--card-bg);
        border-radius: 16px;
        border: 1px solid var(--border);
    }

    /* Title styling (same size/weight/centering as login) */
    .login-title {
        font-size: 29px !important;
        font-weight: 700 !important;
        text-align: center;
        margin-bottom: 40px !important;
        color: var(--text);
    }

    /* Form group spacing (same as login) */
    .form-group {
        margin-bottom: 32px !important;
    }

    /* Label styling (same size/weight as login) */
    .form-label {
        font-size: 16px !important;
        font-weight: 500 !important;
        margin-bottom: 12px !important;
        color: var(--text);
        display: block;
    }

    /* Input field styling (same padding/rounding/colors as login) */
    .form-input-lg {
        padding: 18px 19px !important;
        font-size: 15px !important;
        border-radius: 13px !important;
        border: 1px solid var(--border) !important;
        background: var(--bg) !important;
        color: var(--text) !important;
        outline: none !important;
    }

    .form-input-lg:focus {
        border-color: var(--accent) !important;
        box-shadow: 0 0 0 2px rgba(0, 149, 246, 0.15) !important;
    }

    /* Button group layout (same vertical spacing as login) */
    .button-group {
        display: flex;
        flex-direction: column;
        gap: 16px;
        margin-top: 8px;
    }

    /* Submit button (same size/color/rounding as login's "Log in" button) */
    .btn-lg-custom {
        padding: 18px !important;
        font-size: 16px !important;
        font-weight: 600 !important;
        border-radius: 13px !important;
        background: var(--accent) !important;
        border: none !important;
        color: white !important;
        cursor: pointer !important;
        transition: opacity 0.2s !important;
    }

    .btn-lg-custom:hover {
        opacity: 0.9 !important;
    }

    /* Link button (same size/color as login's "Register" link) */
    .btn-link-lg {
        font-size: 15px !important;
        font-weight: 600 !important;
        color: var(--accent) !important;
        text-decoration: none !important;
        padding: 8px !important;
        text-align: center;
    }

    .btn-link-lg:hover {
        text-decoration: underline !important;
    }
</style>
{% endblock %}
