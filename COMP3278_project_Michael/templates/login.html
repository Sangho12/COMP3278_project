{% extends 'base.html' %}
{% block title %}Login | HKUgram{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8 login-wrapper">
    <div class="login-container">
      <h2 class="login-title">Log in</h2>
      <form method="post" action="{{ url_for('login') }}">
        <!-- Username Input -->
        <div class="mb-4 form-group">
          <label class="form-label">Username</label>
          <input class="form-control form-input-lg" name="username" required />
        </div>
        <!-- Password Input -->
        <div class="mb-4 form-group">
          <label class="form-label">Password</label>
          <input class="form-control form-input-lg" type="password" name="password" required />
        </div>
        <!-- Action Buttons -->
        <div class="button-group">
          <button class="btn btn-primary btn-lg-custom" type="submit">Log in</button>
          <a class="btn btn-link btn-link-lg" href="{{ url_for('register') }}">Register</a>
        </div>
      </form>
    </div>
  </div>
</div>

<style>

    .login-wrapper {
        margin-top: 64px !important; 
        display: flex;
        justify-content: center;
    }

    .login-container {
        max-width: 360px; 
        padding: 48px 40px !important; 
        background: var(--card-bg);
        border-radius: 16px;
        border: 1px solid var(--border);
    }

    .login-title {
        font-size: 29px !important;
        font-weight: 700 !important;
        text-align: center;
        margin-bottom: 40px !important;
        color: var(--text);
    }

    .form-group {
        margin-bottom: 32px !important;
    }

    .form-label {
        font-size: 16px !important; 
        font-weight: 500 !important;
        margin-bottom: 12px !important;
        color: var(--text);
        display: block;
    }

    .form-input-lg {
        padding: 18px 19px !important; 
        font-size: 15px !important; 
        border-radius: 13px !important; 
        border: 1px solid var(--border) !important;
        background: var(--bg) !important;
        color: var(--text) !important;
        outline: none !important;
    }

    .form-input-lg:focus {
        border-color: var(--accent) !important;
        box-shadow: 0 0 0 2px rgba(0, 149, 246, 0.15) !important;
    }

    .button-group {
        display: flex;
        flex-direction: column;
        gap: 16px; 
        margin-top: 8px; 
    }

    .btn-lg-custom {
        padding: 18px !important; 
        font-size: 16px !important; 
        font-weight: 600 !important;
        border-radius: 13px !important;
        background: var(--accent) !important;
        border: none !important;
        color: white !important;
        cursor: pointer !important;
        transition: opacity 0.2s !important;
    }

    .btn-lg-custom:hover {
        opacity: 0.9 !important;
    }

    .btn-link-lg {
        font-size: 15px !important; 
        font-weight: 600 !important;
        color: var(--accent) !important;
        text-decoration: none !important;
        padding: 8px !important; 
        text-align: center;
    }

    .btn-link-lg:hover {
        text-decoration: underline !important;
    }
</style>
{% endblock %}
