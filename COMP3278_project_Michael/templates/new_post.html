{% extends 'base.html' %} 
{% block title %}New Post - HkuGram{% endblock %} 
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8 new-post-wrapper">
    <!-- 5% wider container (360px * 1.05 = 378px) -->
    <div class="new-post-container">
      <!-- Page title (matches login page's title style) -->
      <div class="text-center mb-0">
        <h1 class="new-post-main-title">HkuGram</h1>
        <h2 class="new-post-subtitle">Create a New Post</h2>
      </div>

      <!-- Form (matches login form styling) -->
      <form method="post" action="{{ url_for('new_post') }}">
        <!-- Content Textarea -->
        <div class="mb-4 form-group">
          <label for="content" class="form-label">Content</label>
          <textarea 
            class="form-control form-input-lg" 
            name="content" 
            id="content"
            rows="4" 
            placeholder="Share your thoughts..."
          ></textarea>
        </div>

        <!-- Image URL Input -->
        <div class="mb-4 form-group">
          <label for="image_url" class="form-label">Image URL</label>
          <input 
            class="form-control form-input-lg" 
            name="image_url" 
            id="image_url"
            type="url"
            placeholder="https://example.com/photo.jpg"
          />
        </div>

        <!-- Feeling Emoji Input -->
        <div class="mb-4 form-group">
          <label for="feeling_emoji" class="form-label">Feeling (emoji)</label>
          <input 
            class="form-control form-input-lg" 
            name="feeling_emoji" 
            id="feeling_emoji"
            maxlength="4" 
            placeholder="😊, 🎉, etc."
          />
        </div>

        <!-- Action Buttons (matches login button group style) -->
        <div class="button-group">
          <button class="btn btn-primary btn-lg-custom" type="submit">Post</button>
          <a class="btn btn-link btn-link-lg" href="{{ url_for('feed') }}">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>

<style>
    /* Matches login page style + 5% wider container */
    
    /* Wrapper - matches login-wrapper (centered) */
    .new-post-wrapper {
        margin-top: 64px !important; /* Same as login page (20% smaller than original) */
        display: flex;
        justify-content: center;
    }

    /* Container - 5% wider than login's 360px (360 * 1.05 = 378px) */
    .new-post-container {
        max-width: 500px !important; /* 5% larger than login's 360px */
        padding: 48px 40px !important; /* Same as login page (20% smaller than original) */
        background: var(--card-bg);
        border-radius: 16px;
        border: 1px solid var(--border);
    }

    /* Main title (HkuGram) - matches login-title style */
    .new-post-main-title {
        font-size: 29px !important; /* Same as login page */
        font-weight: 700 !important;
        text-align: center;
        margin-bottom: 8px !important;
        color: var(--text);
    }

    /* Subtitle (Create a New Post) - matches login form-label style */
    .new-post-subtitle {
        font-size: 16px !important; /* Same as login page */
        font-weight: 500 !important;
        text-align: center;
        margin-bottom: 40px !important; /* Same as login page */
        color: var(--text-muted);
    }

    /* Form groups - matches login form-group */
    .form-group {
        margin-bottom: 32px !important; /* Same as login page */
    }

    /* Form labels - centered + matches login form-label */
    .form-label {
        font-size: 16px !important; /* Same as login page */
        font-weight: 500 !important;
        margin-bottom: 12px !important; /* Same as login page */
        color: var(--text);
        display: block;
        text-align: center; /* Centered labels */
    }

    /* Form inputs/textarea - centered + matches login form-input-lg */
    .form-input-lg {
        padding: 18px 19px !important; /* Same as login page */
        font-size: 15px !important; /* Same as login page */
        border-radius: 13px !important; /* Same as login page */
        border: 1px solid var(--border) !important;
        background: var(--bg) !important;
        color: var(--text) !important;
        outline: none !important;
        text-align: center; /* Centered input text */
        width: 100%; /* Ensure inputs fill the wider container */
    }

    /* Textarea specific - left-aligned text (natural for multi-line) */
    textarea.form-input-lg {
        text-align: left;
        resize: vertical;
    }

    .form-input-lg:focus {
        border-color: var(--accent) !important;
        box-shadow: 0 0 0 2px rgba(0, 149, 246, 0.15) !important;
    }

    /* Button group - matches login button-group */
    .button-group {
        display: flex;
        flex-direction: column;
        gap: 16px; /* Same as login page */
        margin-top: 8px; /* Same as login page */
    }

    /* Post button - matches login btn-lg-custom */
    .btn-lg-custom {
        padding: 18px !important; /* Same as login page */
        font-size: 16px !important; /* Same as login page */
        font-weight: 600 !important;
        border-radius: 13px !important; /* Same as login page */
        background: var(--accent) !important;
        border: none !important;
        color: white !important;
        cursor: pointer !important;
        transition: opacity 0.2s !important;
        width: 100%; /* Ensure button fills the wider container */
    }

    .btn-lg-custom:hover {
        opacity: 0.9 !important;
    }

    /* Cancel link - matches login btn-link-lg */
    .btn-link-lg {
        font-size: 15px !important; /* Same as login page */
        font-weight: 600 !important;
        color: var(--accent) !important;
        text-decoration: none !important;
        padding: 8px !important; /* Same as login page */
        text-align: center;
        display: block; /* Ensure link fills the wider container */
    }

    .btn-link-lg:hover {
        text-decoration: underline !important;
    }
</style>
{% endblock %}
