{% extends 'base.html' %} {% block title %}Stories - {{ prof.username }}{%
endblock %} {% block content %}
<div class="row justify-content-center">
  <div class="col-md-8">
    <div class="card mb-3">
      <div class="card-body text-center">
        <img
          id="storyImage"
          src="{{ stories[0].image_video_url }}"
          style="max-width: 100%; max-height: 70vh; object-fit: contain"
        />
        <!-- stories have no caption per spec -->
        <div class="d-flex justify-content-between mt-3">
          <div><strong>{{ prof.username }}</strong></div>
          <div><span id="storyTimer">24:00</span></div>
        </div>
      </div>
    </div>

    <div class="d-flex gap-2 justify-content-center">
      <button class="btn btn-outline-secondary" id="prevBtn">Prev</button>
      <button class="btn btn-outline-secondary" id="nextBtn">Next</button>
      <a class="btn btn-link" href="{{ url_for('feed') }}">Back to feed</a>
    </div>
  </div>
</div>

<script>
    const stories = {{ stories|tojson }};
    let idx = 0;
    let timerInterval = null;

    function showStory(i) {
      idx = i;
      const s = stories[idx];
      const img = document.getElementById('storyImage');
      img.src = s.image_video_url;
      startTimer(s.created_at);
    }

    function startTimer(created_at) {
      clearInterval(timerInterval);
      // compute remaining seconds until 24h
  // created_at from SQLite is usually 'YYYY-MM-DD HH:MM:SS' - make it ISO-friendly
  const then = new Date(created_at.replace(' ', 'T'));
      const expire = new Date(then.getTime() + 24*60*60*1000);
      function update() {
        const now = new Date();
        let diff = Math.max(0, Math.floor((expire - now)/1000));
        if (diff <= 0) { clearInterval(timerInterval); document.getElementById('storyTimer').innerText='Expired'; return; }
        const h = Math.floor(diff/3600); diff%=3600; const m = Math.floor(diff/60); const s = diff%60;
        document.getElementById('storyTimer').innerText = `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
      }
      update();
      timerInterval = setInterval(update, 1000);
    }

    document.getElementById('prevBtn').addEventListener('click', ()=>{
      if (idx>0) showStory(idx-1);
    });
    document.getElementById('nextBtn').addEventListener('click', ()=>{
      if (idx < stories.length-1) showStory(idx+1);
      else window.location = '{{ url_for("feed") }}';
    });

    // initialize
    showStory(0);
</script>
{% endblock %}
