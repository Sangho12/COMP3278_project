{% extends 'base.html' %} {% block title %}Register - HkuGram{% endblock %} {%
block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <h2>Register</h2>
    <form method="post" action="{{ url_for('register') }}">
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input class="form-control" name="username" required />
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input class="form-control" type="password" name="password" required />
      </div>
      <div class="mb-3">
        <label class="form-label">Profile picture URL (optional)</label>
        <input class="form-control" name="profile_picture" />
      </div>
      <button class="btn btn-success" type="submit">Create account</button>
      <a class="btn btn-link" href="{{ url_for('login') }}">Back to login</a>
    </form>
  </div>
</div>
{% endblock %}
